name: Android launch and Studio smoke
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'phase2-reconcile-volume-controls']
jobs:
  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 emulator system-images;android-35;google_apis;x86_64'
      - run: npm ci --no-audit --no-fund
      - name: Static core flow tests
        run: npm run test:android-smoke
      - name: Typecheck and Android bundle
        run: |
          npm run typecheck
          npx expo export --platform android
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Ensure debug signing key exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Install app and open Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            ./android/gradlew -p android assembleDebug -PreactNativeArchitectures=x86_64
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.firstkingdavid.davevideoeditor || true
            adb shell monkey -p com.firstkingdavid.davevideoeditor 1
            for attempt in $(seq 1 30); do
              if adb shell dumpsys activity activities | grep -q 'com.firstkingdavid.davevideoeditor'; then break; fi
              sleep 2
            done
            if ! adb shell dumpsys activity activities | grep -q 'com.firstkingdavid.davevideoeditor'; then
              adb logcat -d -t 2000 > ../android-launch-smoke.log
              cat ../android-launch-smoke.log
              exit 1
            fi
            sleep 5
            adb logcat -d -t 2000 > ../android-launch-smoke.log
            if grep -E 'FATAL EXCEPTION|ReactNativeJS.*(Invariant Violation|TypeError|ReferenceError)' ../android-launch-smoke.log; then exit 1; fi
