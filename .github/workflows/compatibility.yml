name: App compatibility checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  app-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx expo export --platform android
